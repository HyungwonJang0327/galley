name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 소비자(dashboard)가 빌드된 dist·d.ts를 참조하므로 typecheck·test 앞에서 먼저 빌드
      - run: pnpm --filter @galley/ui build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # 레이아웃 실측(decisions/layout-measurement.md): dashboard 프로덕션 빌드 → next start → /design 을
  # 러너 기본 설치 Chrome(google-chrome)으로 열어 AppShell 스크롤·Select 팝업을 실측. verify와 병렬.
  layout:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @galley/ui build
      # 러너에 한글 폰트가 없으면 한글이 □(notdef)로 그려져 글자 폭이 달라지고, 텍스트 폭에 의존하는
      # 검사(긴 보조 텍스트 ellipsis 등)가 실제와 다르게 판정된다. 스크린샷 판독을 위해서도 필요.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-nanum
      - run: pnpm --filter dashboard verify:layout --out ${{ runner.temp }}/layout-shots
      # 실패 원인 진단용 스크린샷(shell-scroll.png · select-N.png)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: ${{ runner.temp }}/layout-shots
          if-no-files-found: ignore

  # 워커 프로세스 스모크(decisions/run-execution-model.md §3): 실제 `node bin/worker.ts`를 띄우고
  # SIGTERM → 종료 코드 0·"워커 종료" 로그 한 줄만 단언(타이밍 단언 없음). 기본 스위트(verify)와 분리.
  # required check로 둔다. 한 번이라도 흔들리면 즉시 informational로 내리고 원인은 워커 종료 경로에서
  # 찾는다 — 종료 코드와 로그만 보는 테스트는 결정적이어야 정상이다(2026-09-13 결정).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @galley/pipeline test:smoke

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
